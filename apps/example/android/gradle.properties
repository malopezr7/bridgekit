org.gradle.jvmargs=-Xmx2048m -XX:MaxMetaspaceSize=512m
# Reuse task outputs across builds (local cache; setup-gradle persists it on CI)
org.gradle.caching=true
android.useAndroidX=true
android.enableJetifier=false
# Enable Hermes engine
hermesEnabled=true
# New Architecture (required for react-native-nitro-modules)
newArchEnabled=true
