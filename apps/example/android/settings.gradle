pluginManagement {
    includeBuild(
        providers.exec {
            workingDir(rootDir)
            commandLine("node", "--print", "require('path').dirname(require.resolve('@react-native/gradle-plugin/package.json', { paths: [require('path').dirname(require.resolve('react-native/package.json'))] }))")
        }.standardOutput.asText.get().trim()
    )
    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
    }
}

plugins {
    id("com.facebook.react.settings")
}

extensions.configure(com.facebook.react.ReactSettingsExtension) { ex ->
    ex.autolinkLibrariesFromCommand()
}

rootProject.name = 'BridgeKitExample'
include ':app'

includeBuild(
    providers.exec {
        workingDir(rootDir)
        commandLine("node", "--print", "require('path').dirname(require.resolve('@react-native/gradle-plugin/package.json', { paths: [require('path').dirname(require.resolve('react-native/package.json'))] }))")
    }.standardOutput.asText.get().trim()
)
