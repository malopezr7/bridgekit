pluginManagement {
    // node_modules is hoisted at the monorepo root (pnpm nodeLinker: hoisted): three levels up.
    includeBuild("../../../node_modules/@react-native/gradle-plugin")
    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
    }
}

plugins {
    id("com.facebook.react.settings")
}

extensions.configure(com.facebook.react.ReactSettingsExtension) { ex ->
    ex.autolinkLibrariesFromCommand()
}

rootProject.name = 'BridgeKitExample'
include ':app'

includeBuild("../../../node_modules/@react-native/gradle-plugin")
