apply plugin: "com.android.application"
apply plugin: "org.jetbrains.kotlin.android"
apply plugin: "com.facebook.react"

react {
    // node_modules is hoisted at the monorepo root (pnpm nodeLinker: hoisted), so the
    // RN Gradle Plugin must be pointed at the workspace root instead of the app package.
    root = file("../../../..")
    reactNativeDir = file("../../../../node_modules/react-native")
    codegenDir = file("../../../../node_modules/@react-native/codegen")

    // RN 0.83 ships hermesc in the standalone hermes-compiler package, not react-native/sdks.
    hermesCommand = "$rootDir/../../../node_modules/hermes-compiler/hermesc/%OS-BIN%/hermesc"

    // Pulls every autolinked native module (BridgeKit, Nitro) into the app. No manual deps.
    autolinkLibrariesWithApp()
}

android {
    ndkVersion rootProject.ext.ndkVersion
    buildToolsVersion rootProject.ext.buildToolsVersion
    compileSdk rootProject.ext.compileSdkVersion

    namespace "com.bridgekit.example"
    defaultConfig {
        applicationId "com.bridgekit.example"
        minSdk rootProject.ext.minSdkVersion
        targetSdk rootProject.ext.targetSdkVersion
        versionCode 1
        versionName "1.0"
    }

    signingConfigs {
        debug {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
        release {
            signingConfig signingConfigs.debug
            minifyEnabled false
            proguardFiles getDefaultProguardFile("proguard-android.txt"), "proguard-rules.pro"
        }
    }
}

dependencies {
    // Versions are set by the React Native Gradle Plugin.
    // BridgeKit and react-native-nitro-modules are linked via autolinkLibrariesWithApp().
    implementation("com.facebook.react:react-android")
    implementation("com.facebook.react:hermes-android")
}
