org.gradle.jvmargs=-Xmx2048m -XX:MaxMetaspaceSize=512m
android.useAndroidX=true
android.enableJetifier=false
# Enable Hermes engine (required for react-native-nitro-modules / New Architecture)
hermesEnabled=true
# New Architecture (required for react-native-nitro-modules)
newArchEnabled=true
# Build all ABIs — reduces to the device ABI at install time automatically.
reactNativeArchitectures=arm64-v8a,armeabi-v7a,x86,x86_64
