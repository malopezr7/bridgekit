apply plugin: "com.android.application"
apply plugin: "org.jetbrains.kotlin.android"
// Kotlin Compose compiler plugin (Kotlin 2.x — uses plugin instead of composeOptions).
apply plugin: "org.jetbrains.kotlin.plugin.compose"

android {
    ndkVersion rootProject.ext.ndkVersion
    buildToolsVersion rootProject.ext.buildToolsVersion
    compileSdk rootProject.ext.compileSdkVersion

    namespace "com.bridgekit.callstackbrownfield.host"

    defaultConfig {
        applicationId "com.bridgekit.callstackbrownfield.host"
        minSdk rootProject.ext.minSdkVersion
        targetSdk rootProject.ext.targetSdkVersion
        versionCode 1
        versionName "1.0"
    }

    buildFeatures {
        compose true
    }

    // NOTE: Do NOT add composeOptions.kotlinCompilerExtensionVersion here.
    // That is Kotlin 1.9 only. With Kotlin 2.x, the compose compiler plugin handles everything.

    signingConfigs {
        debug {
            storeFile file('../debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
        release {
            signingConfig signingConfigs.debug
            minifyEnabled false
        }
    }
}

dependencies {
    // Compose BOM — resolves all Compose library versions consistently.
    def composeBom = platform("androidx.compose:compose-bom:2025.06.00")
    implementation composeBom

    implementation "androidx.compose.ui:ui"
    implementation "androidx.compose.material3:material3"
    implementation "androidx.compose.ui:ui-tooling-preview"
    debugImplementation "androidx.compose.ui:ui-tooling"

    implementation "androidx.activity:activity-compose:1.10.1"
    implementation "androidx.fragment:fragment-ktx:1.8.8"

    // Material theme — provides the AppTheme window style referenced in AndroidManifest.
    implementation "com.google.android.material:material:1.12.0"

    // RN library module — consumed from mavenLocal() after `brownfield publish:android`.
    // Must match groupId/artifactId/version in reactnativeapp/build.gradle.kts.
    implementation "com.bridgekit:reactnativeapp:1.0.0"
}

repositories {
    // AAR published locally by `brownfield publish:android --module-name reactnativeapp`.
    mavenLocal()
    google()
    mavenCentral()
}
