name: iOS Facade

# The distributable iOS facade (packages/core/ios-facade/) is a generated artifact:
# a C++-clean BridgeKit.framework skeleton (interface + modulemap + headers, no
# binary) that ships in the npm package and lets consumers (Axion) expose BridgeKit
# without dragging Nitro/C++. It MUST stay in sync with the iOS Swift source. This
# workflow rebuilds it on a Mac and fails if the committed copy is stale or leaks
# C++ — so a source change can never ship with a divergent facade.

# This is also the ONLY job that compiles packages/core/ios at all. While it was
# manual-only, two blocking Swift compile errors survived 23 days on main
# (Router.isFinalClosed had never compiled), because nothing else builds the iOS
# runtime. That alone justifies the runner time.
#
# Previously workflow_dispatch-only: the whole ios-xcframework/ workspace was
# gitignored, so `pod install` could not run from a clean clone. The hand-authored
# inputs (Podfile, Podfile.lock, umbrella header, build host, privacy manifest)
# are committed now, so this runs on PRs that touch anything the facade is built
# from.
# DELIBERATELY NOT ON PULL REQUESTS.
#
# This job archives React Native twice under library-evolution to produce a
# framework whose public interface is 126 lines of pure Swift. It takes ~30
# minutes. Putting that on every iOS pull request would make contributing
# miserable, which is the opposite of what BridgeKit exists for.
#
# The two failure modes it protects against are already covered on PRs, cheaply,
# by the `swift` job in ci-baseline.yml:
#   - "does packages/core/ios compile?"  -> swiftc -typecheck of the engine (~2s)
#   - "is the committed facade stale?"   -> compile-swift.test.ts typechecks
#     generated Swift against packages/core/ios-facade (~48s), which is precisely
#     how the S5 facade skew was caught.
#
# What only the full archive can prove — that the xcframework links, that the
# plain-Swift SPM binaryTarget consumer builds, and that the regenerated facade
# is byte-identical — is checked where it actually matters: on main, on release
# tags, and on demand.
on:
  push:
    branches: [main]
    paths:
      - 'packages/core/ios/**'
      - 'packages/core/ios-facade/**'
      - 'packages/core/ios-xcframework/**'
      - 'packages/core/nitrogen/generated/ios/**'
      - 'packages/core/nitro.json'
      - 'packages/core/BridgeKit.podspec'
      - 'packages/core/scripts/build-ios-xcframework.sh'
      - 'packages/core/scripts/create-ios-xcframework-project.rb'
      - 'packages/core/scripts/patch-nitrogen-namespaces.js'
      - '.github/workflows/ios-facade.yml'
  # release.yml calls this before publishing, so a release can never ship an
  # unverified facade even though tags do not trigger it directly.
  workflow_call:
  workflow_dispatch:

concurrency:
  group: ios-facade-${{ github.ref }}
  # Superseded runs are cancelled, including on main. This job takes ~30 minutes,
  # so consecutive merges otherwise queue half-hour macOS jobs behind each other
  # to verify states that are already obsolete. Only the current tip matters.
  cancel-in-progress: true

jobs:
  ios-facade:
    name: Build & verify iOS facade
    runs-on: macos-15
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build BridgeKit.xcframework + extract facade
        run: ./packages/core/scripts/build-ios-xcframework.sh

      - name: Report toolchain
        run: |
          xcodebuild -version
          swiftc --version

      # Compares the DECLARATIONS in the committed facade against the ones just
      # built, not the bytes.
      #
      # A byte diff cannot work here. .swiftinterface, .swiftdoc and Info.plist
      # are all compiler-generated, so they move whenever the toolchain does: a
      # runner on Xcode 16.4 / Swift 6.1.2 produced a six-line diff against a
      # facade generated with Xcode 17 / Swift 6.3.2, entirely in the
      # `// swift-compiler-version` and `// swift-module-flags` headers. The
      # public API was identical. Gating on bytes means the guard fails on every
      # Xcode bump on either side, and a guard that cries wolf gets disabled.
      #
      # What actually matters is what consumers compile against: the declarations.
      - name: Verify committed ios-facade declares the same API
        run: |
          set -euo pipefail

          # Drop compiler metadata headers; keep declarations.
          normalise() { grep -vE '^// swift-(compiler-version|module-flags)' "$1" | sed '/^[[:space:]]*$/d'; }

          status=0
          while IFS= read -r built; do
            rel="${built#./}"
            committed="$(mktemp)"
            if ! git show "HEAD:$rel" > "$committed" 2>/dev/null; then
              echo "::error::$rel exists in the build but not in the commit — a new slice needs committing."
              status=1
              continue
            fi
            if ! diff -u <(normalise "$committed") <(normalise "$built") > /tmp/iface.diff; then
              echo "::error::$rel declares a different API than the committed copy."
              echo "The iOS Swift source changed without regenerating the facade. Run"
              echo "packages/core/scripts/build-ios-xcframework.sh and commit packages/core/ios-facade/."
              cat /tmp/iface.diff
              status=1
            fi
          done < <(find packages/core/ios-facade -name '*.swiftinterface' | sort)

          if [ "$status" -ne 0 ]; then exit 1; fi
          echo "✅ committed ios-facade declares the same API as the freshly built one"

          # Informational: byte-level movement is expected across toolchains and
          # is not a failure, but it is worth seeing in the log.
          if ! git diff --quiet -- packages/core/ios-facade; then
            echo "note: byte-level differences below are compiler metadata (toolchain drift), not API changes."
            git --no-pager diff --stat -- packages/core/ios-facade
          fi

      - name: Verify facade interface is C++-clean
        run: |
          leaks=$(grep -rEl 'NitroModules|margelo|std::|[^A-Za-z]AnyMap[^A-Za-z]|HybridBridge' \
            packages/core/ios-facade --include='*.swiftinterface' || true)
          if [ -n "$leaks" ]; then
            echo "::error::facade .swiftinterface leaks Nitro/C++ symbols:"
            echo "$leaks"
            exit 1
          fi
          echo "✅ facade interface is C++-clean (no Nitro/C++ leak)"
