name: CI Baseline

# Consolidated pipeline: 3 jobs instead of 10.
# - node: every pure-Node check on one runner (single install, single build).
# - jvm: CLI Jest suite (Kotlin harness included) + the Android Gradle gates,
#   sharing one Gradle daemon and the local build cache.
# - swift: only the Darwin-gated Swift compiler harness (everything else is
#   already covered on Ubuntu by the jvm/node jobs).

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  NODE_VERSION: 22.15.0

jobs:
  node:
    name: Node checks
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify hoisted Android paths
        run: |
          test -d node_modules/@react-native/gradle-plugin
          test -d node_modules/react-native

      # A package whose sources changed must not still carry an already-published
      # version: that is how packages/cli/src drifted nine commits — spanning a
      # wire-breaking hash change — underneath a frozen 0.0.1-beta.0.
      - name: Verify changed packages carry an unpublished version
        if: github.event_name == 'pull_request'
        run: |
          set -euo pipefail
          base="${{ github.event.pull_request.base.sha }}"
          git fetch --no-tags --depth=1 origin "$base"
          failed=0
          for dir in packages/core packages/cli; do
            if ! git diff --quiet "$base" HEAD -- "$dir/src"; then
              name="$(node -p "require('./$dir/package.json').name")"
              version="$(node -p "require('./$dir/package.json').version")"
              if npm view "$name@$version" version >/dev/null 2>&1; then
                echo "::error file=$dir/package.json::$dir/src changed but $name@$version is already published. Bump the version."
                failed=1
              else
                echo "ok: $dir/src changed, $name@$version is unpublished"
              fi
            fi
          done
          exit "$failed"

      - name: Run Biome check
        run: pnpm check

      - name: Build workspaces
        run: pnpm build

      - name: Typecheck workspaces
        run: pnpm -r typecheck

      - name: Run web Jest project
        run: pnpm --filter @malopezr7/bridgekit test:web

      - name: Run native Jest project
        run: pnpm --filter @malopezr7/bridgekit test:native

      - name: Verify core package contents
        working-directory: packages/core
        run: npm pack --dry-run --ignore-scripts=false

      - name: Verify publish tarball contents
        run: |
          set -euo pipefail
          tmp="$(mktemp -d)"
          core_tarball="$(cd packages/core && npm pack --json --pack-destination "$tmp" | node -e "const c=require('fs').readFileSync(0,'utf8');const i=c.lastIndexOf('\n[');process.stdout.write(JSON.parse(c.slice(i>=0?i+1:c.indexOf('[')))[0].filename)")"
          tar -tzf "$tmp/$core_tarball" > "$tmp/core-list.txt"
          grep -Fx "package/dist/commonjs/index.js" "$tmp/core-list.txt"
          grep -Fx "package/dist/typescript/index.d.ts" "$tmp/core-list.txt"
          grep -Fx "package/LICENSE" "$tmp/core-list.txt"
          grep -Fx "package/android/build.gradle.kts" "$tmp/core-list.txt"
          grep -q "package/android/src/main" "$tmp/core-list.txt"
          if grep -q "android/src/test" "$tmp/core-list.txt"; then
            exit 1
          fi

          # iOS payload. Without these the whole iOS half of the package could
          # silently vanish from a release and every job here would stay green.
          grep -Fx "package/BridgeKit.podspec" "$tmp/core-list.txt"
          grep -Fx "package/react-native.config.js" "$tmp/core-list.txt"
          grep -Fx "package/nitro.json" "$tmp/core-list.txt"
          grep -Fx "package/ios/engine/Router.swift" "$tmp/core-list.txt"
          grep -Fx "package/nitrogen/generated/ios/BridgeKit+autolinking.rb" "$tmp/core-list.txt"
          grep -q "package/ios-facade/.*\.swiftinterface" "$tmp/core-list.txt"

          cli_tarball="$(cd packages/cli && npm pack --json --pack-destination "$tmp" | node -e "const c=require('fs').readFileSync(0,'utf8');const i=c.lastIndexOf('\n[');process.stdout.write(JSON.parse(c.slice(i>=0?i+1:c.indexOf('[')))[0].filename)")"
          tar -tzf "$tmp/$cli_tarball" > "$tmp/cli-list.txt"
          grep -Fx "package/dist/index.js" "$tmp/cli-list.txt"
          grep -Fx "package/LICENSE" "$tmp/cli-list.txt"

      - name: Verify generated bindings
        run: |
          pnpm --filter bridgekit-example generate --check
          pnpm --filter bridgekit-example generate:ios --check
          pnpm --filter bridgekit-example-callstack-brownfield generate --check
          pnpm --filter bridgekit-example-callstack-brownfield generate:ios --check
          pnpm --filter bridgekit-example-expo-brownfield generate --check
          pnpm --filter bridgekit-example-expo-brownfield generate:ios --check

  jvm:
    name: CLI tests + Android Gradle
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build core contract exports
        run: pnpm --filter @malopezr7/bridgekit build

      - name: Build CLI
        run: pnpm --filter @malopezr7/bridgekit-cli build

      # Single Jest pass: the negative Kotlin compiler gate is enabled inline
      # instead of re-running the whole test file a second time. Gradle-backed
      # tests live in one file, so they execute sequentially in one worker.
      - name: Run CLI Jest tests (with Kotlin negative gate)
        run: BRIDGEKIT_RUN_KOTLIN_NEGATIVE=1 pnpm --filter @malopezr7/bridgekit-cli test

      # One Gradle invocation for both gates: generated-fixture compilation and
      # the BridgeKit core-library unit tests share the daemon and build cache.
      # --continue keeps per-gate signal when one task fails; --rerun forces the
      # unit tests to actually execute instead of replaying a build-cache hit.
      - name: Run Gradle gates (fixture compile + core unit tests)
        working-directory: apps/example/android
        run: ./gradlew --continue :app:compileDebugKotlin :malopezr7_bridgekit:testDebugUnitTest --rerun -PbridgekitGeneratedFixturesDir=${{ github.workspace }}/packages/cli/build/generated-fixtures/kotlin-good

  swift:
    name: CLI Swift compiler harness
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build core contract exports
        run: pnpm --filter @malopezr7/bridgekit build

      - name: Build CLI
        run: pnpm --filter @malopezr7/bridgekit-cli build

      # Only the Darwin-gated Swift harness runs here; the rest of the CLI
      # suite is covered by the jvm job on Ubuntu.
      - name: Run Swift compiler harness
        run: pnpm --filter @malopezr7/bridgekit-cli exec jest --config ./jest.config.cjs compile-swift.test.ts
